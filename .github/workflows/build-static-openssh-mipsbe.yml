name: build-static-openssh-mipsbe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-static-openssh-mipsbe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      TOOLCHAIN_URL: https://downloads.openwrt.org/releases/25.12.5/targets/bmips/bcm63268/openwrt-toolchain-25.12.5-bmips-bcm63268_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      OPENSSH_VERSION: 10.5p1
      OPENSSL_VERSION: 3.5.4
      ZLIB_VERSION: 1.3.1
      TARGET: mips-openwrt-linux-musl
      PREFIX: /mnt/myvol

    steps:
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file perl pkg-config tar xz-utils zstd

      - name: Download and unpack OpenWrt toolchain
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          curl --fail --retry 3 -L "$TOOLCHAIN_URL" -o /tmp/openwrt-toolchain.tar.zst
          tar --use-compress-program=unzstd -xf /tmp/openwrt-toolchain.tar.zst -C "$GITHUB_WORKSPACE/toolchain" --strip-components=1
          TOOLCHAIN_GCC="$(find "$GITHUB_WORKSPACE/toolchain" \( -type f -o -type l \) -name "${TARGET}-gcc" -print -quit)"
          if [ -z "$TOOLCHAIN_GCC" ]; then
            echo "failed to find ${TARGET}-gcc under unpacked toolchain" >&2
            find "$GITHUB_WORKSPACE/toolchain" -maxdepth 4 -type d -o -type l -o -type f | sort | sed -n '1,200p' >&2
            exit 1
          fi
          TOOLCHAIN_BIN="$(dirname "$TOOLCHAIN_GCC")"
          echo "STAGING_DIR=$GITHUB_WORKSPACE/toolchain" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          "$TOOLCHAIN_GCC" --version
          STAGING_DIR="$GITHUB_WORKSPACE/toolchain" "$TOOLCHAIN_GCC" -x c -c /dev/null -o /tmp/openwrt-toolchain-smoke.o

      - name: Prepare paths
        run: |
          set -eux
          echo "DEPS=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"
          echo "ROOTFS=$GITHUB_WORKSPACE/rootfs" >> "$GITHUB_ENV"
          echo "CFLAGS=-Os -pipe -mips32 -mtune=mips32 -msoft-float" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$GITHUB_WORKSPACE/deps/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-static -L$GITHUB_WORKSPACE/deps/lib" >> "$GITHUB_ENV"
          echo "LIBS=-latomic" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/deps" "$GITHUB_WORKSPACE/rootfs"

      - name: Build static zlib
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/src"
          curl --fail --retry 3 -L "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz" -o zlib.tar.gz
          tar -xf zlib.tar.gz
          cd "zlib-${ZLIB_VERSION}"
          CHOST="$TARGET" CC="${TARGET}-gcc" AR="${TARGET}-ar" RANLIB="${TARGET}-ranlib" \
            ./configure --static --prefix="$DEPS"
          make -j"$(nproc)" CC="${TARGET}-gcc" AR="${TARGET}-ar" RANLIB="${TARGET}-ranlib"
          make install DESTDIR= prefix="$DEPS"
          test -f "$DEPS/include/zlib.h" || { find "$DEPS" -maxdepth 3 -print; exit 1; }
          test -f "$DEPS/lib/libz.a" || { find "$DEPS" -maxdepth 3 -print; exit 1; }

      - name: Build static OpenSSL
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/src"
          curl --fail --retry 3 -L "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          CROSS_COMPILE="${TARGET}-" \
            ./Configure linux-mips32 \
              no-shared no-module no-dso no-tests no-async \
              --prefix="$DEPS" \
              --openssldir="$DEPS/ssl"
          make -j"$(nproc)"
          make install_sw DESTDIR=
          test -f "$DEPS/include/openssl/ssl.h" || { find "$DEPS" -maxdepth 4 -print; exit 1; }
          test -f "$DEPS/lib/libssl.a" || { find "$DEPS" -maxdepth 4 -print; exit 1; }
          test -f "$DEPS/lib/libcrypto.a" || { find "$DEPS" -maxdepth 4 -print; exit 1; }

      - name: Build static OpenSSH
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/src"
          curl --fail --retry 3 -L "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${OPENSSH_VERSION}.tar.gz" -o openssh.tar.gz
          tar -xf openssh.tar.gz
          cd "openssh-${OPENSSH_VERSION}"
          CC="${TARGET}-gcc" AR="${TARGET}-ar" RANLIB="${TARGET}-ranlib" STRIP="${TARGET}-strip" \
          CFLAGS="$CFLAGS" CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" LIBS="$LIBS" \
            ./configure \
              --host="$TARGET" \
              --build=x86_64-linux-gnu \
              --prefix="$PREFIX" \
              --sysconfdir="$PREFIX/etc/ssh" \
              --libexecdir="$PREFIX/libexec" \
              --with-ssl-dir="$DEPS" \
              --with-zlib="$DEPS" \
              --with-privsep-user=sshd \
              --with-privsep-path="$PREFIX/var/empty" \
              --disable-strip \
              --disable-etc-default-login \
              --disable-lastlog \
              --disable-utmp \
              --disable-utmpx \
              --disable-wtmp \
              --disable-wtmpx \
              --without-bsd-auth \
              --without-kerberos5 \
              --without-pam \
              --without-selinux \
              --without-security-key-builtin \
              --without-libedit \
              --without-xauth \
              ac_cv_func_strnvis=no \
              ac_cv_have_decl_strnvis=no \
              ac_cv_func_strtonum=no \
              ac_cv_have_decl_strtonum=no \
              ac_cv_func_arc4random=no \
              ac_cv_func_arc4random_buf=no || { cat config.log; exit 1; }
          make -j"$(nproc)" sshd sftp-server ssh-keygen
          install -d "$ROOTFS$PREFIX/sbin" "$ROOTFS$PREFIX/bin" "$ROOTFS$PREFIX/libexec"
          install -m 0755 sshd "$ROOTFS$PREFIX/sbin/sshd"
          install -m 0755 ssh-keygen "$ROOTFS$PREFIX/bin/ssh-keygen"
          install -m 0755 sftp-server "$ROOTFS$PREFIX/libexec/sftp-server"
          "${TARGET}-strip" \
            "$ROOTFS$PREFIX/sbin/sshd" \
            "$ROOTFS$PREFIX/bin/ssh-keygen" \
            "$ROOTFS$PREFIX/libexec/sftp-server"

      - name: Install usable sshd_config
        run: |
          set -eux
          install -d "$ROOTFS$PREFIX/etc/ssh" "$ROOTFS$PREFIX/var/empty" "$ROOTFS$PREFIX/var/run"
          if [ ! -f "$ROOTFS$PREFIX/etc/ssh/sshd_config" ]; then
            cp "$GITHUB_WORKSPACE/src/openssh-${OPENSSH_VERSION}/sshd_config" "$ROOTFS$PREFIX/etc/ssh/sshd_config"
          fi
          sed -i \
            -e "s|^#HostKey /etc/ssh/|HostKey $PREFIX/etc/ssh/|" \
            -e "s|^#PidFile .*|PidFile $PREFIX/var/run/sshd.pid|" \
            -e "s|^#Subsystem[[:space:]]\\+sftp[[:space:]].*|Subsystem sftp $PREFIX/libexec/sftp-server|" \
            "$ROOTFS$PREFIX/etc/ssh/sshd_config"
          grep -q "^Subsystem sftp $PREFIX/libexec/sftp-server" "$ROOTFS$PREFIX/etc/ssh/sshd_config" || \
            printf '\nSubsystem sftp %s/libexec/sftp-server\n' "$PREFIX" >> "$ROOTFS$PREFIX/etc/ssh/sshd_config"

      - name: Verify output
        run: |
          set -eux
          file "$ROOTFS$PREFIX/sbin/sshd" "$ROOTFS$PREFIX/libexec/sftp-server"
          test -f "$ROOTFS$PREFIX/etc/ssh/sshd_config"
          "${TARGET}-readelf" -h "$ROOTFS$PREFIX/sbin/sshd"
          if "${TARGET}-readelf" -d "$ROOTFS$PREFIX/sbin/sshd" 2>/dev/null | grep -q NEEDED; then
            echo "sshd is not static" >&2
            exit 1
          fi
          tar -C "$ROOTFS" -czf "$GITHUB_WORKSPACE/openssh-mipsbe-static-mnt-myvol.tar.gz" .

      - name: Upload tarball release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: openssh-mipsbe-static
          ASSET: openssh-mipsbe-static-mnt-myvol.tar.gz
        run: |
          set -eux
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Static OpenSSH for MIPS BE" \
              --notes "Rolling build of static OpenSSH for OpenWrt bmips/bcm63268." \
              --prerelease
          fi
          gh release delete-asset "$RELEASE_TAG" "$ASSET" --yes || true
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/$ASSET" --clobber
